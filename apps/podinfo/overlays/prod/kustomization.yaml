apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo-prod
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs:
      environment: prod
    includeSelectors: false
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
