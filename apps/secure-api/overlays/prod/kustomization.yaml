apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: secure-api-prod
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs:
      environment: prod
    includeSelectors: false
patches:
  - target:
      kind: Deployment
      name: secure-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
