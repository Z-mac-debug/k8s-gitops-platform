# Run with: kyverno test tests/kyverno
# One compliant pod passes every policy; each other pod breaks exactly one.
# verify-image-signatures (ImageValidatingPolicy) needs registry access and a published signed image,
# so it is not unit-tested here.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-policies
policies:
- ../../platform/policies/disallow-latest-tag.yaml
- ../../platform/policies/pod-security-restricted.yaml
- ../../platform/policies/require-labels.yaml
- ../../platform/policies/require-probes.yaml
- ../../platform/policies/require-readonly-rootfs.yaml
- ../../platform/policies/require-requests-limits.yaml
- ../../platform/policies/restrict-image-registries.yaml
resources:
- resources.yaml
results:
- isValidatingPolicy: true
  policy: disallow-latest-tag
  kind: Pod
  resources:
  - good-pod
  result: pass
- isValidatingPolicy: true
  policy: pod-security-restricted
  kind: Pod
  resources:
  - good-pod
  result: pass
- isValidatingPolicy: true
  policy: require-labels
  kind: Pod
  resources:
  - good-pod
  result: pass
- isValidatingPolicy: true
  policy: require-probes
  kind: Pod
  resources:
  - good-pod
  result: pass
- isValidatingPolicy: true
  policy: require-readonly-rootfs
  kind: Pod
  resources:
  - good-pod
  result: pass
- isValidatingPolicy: true
  policy: require-requests-limits
  kind: Pod
  resources:
  - good-pod
  result: pass
- isValidatingPolicy: true
  policy: restrict-image-registries
  kind: Pod
  resources:
  - good-pod
  result: pass
- isValidatingPolicy: true
  policy: disallow-latest-tag
  kind: Pod
  resources:
  - latest-tag-pod
  - untagged-pod
  result: fail
- isValidatingPolicy: true
  policy: pod-security-restricted
  kind: Pod
  resources:
  - privileged-pod
  result: fail
- isValidatingPolicy: true
  policy: require-labels
  kind: Pod
  resources:
  - no-labels-pod
  result: fail
- isValidatingPolicy: true
  policy: require-probes
  kind: Pod
  resources:
  - no-probes-pod
  result: fail
- isValidatingPolicy: true
  policy: require-readonly-rootfs
  kind: Pod
  resources:
  - writable-rootfs-pod
  result: fail
- isValidatingPolicy: true
  policy: require-requests-limits
  kind: Pod
  resources:
  - no-limits-pod
  result: fail
- isValidatingPolicy: true
  policy: restrict-image-registries
  kind: Pod
  resources:
  - untrusted-registry-pod
  result: fail
