apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-api
  namespace: secure-api
  labels:
    app.kubernetes.io/name: secure-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: secure-api
  namespace: secure-api
  labels:
    app.kubernetes.io/name: secure-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: secure-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: secure-api
  namespace: secure-api
  labels:
    app.kubernetes.io/name: secure-api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: secure-api
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-api-allow
  namespace: secure-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secure-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
